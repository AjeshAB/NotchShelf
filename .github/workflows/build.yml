name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so git-build.sh can count commits

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test
        run: ./scripts/test.sh

      - name: Build and package
        run: ./scripts/git-build.sh && ./scripts/package-local.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: NotchShelf-development
          path: build/NotchShelf-development.dmg
