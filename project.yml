name: NotchShelf
options:
  bundleIdPrefix: com.notchshelf
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    CODE_SIGN_STYLE: Automatic
    ENABLE_APP_SANDBOX: NO
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.4.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.7.0
targets:
  NotchShelf:
    type: application
    platform: macOS
    sources: [NotchShelf]
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    info:
      path: NotchShelf/Resources/Info.plist
      properties:
        CFBundleDisplayName: NotchShelf
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        LSUIElement: true
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: Copyright © 2026 NotchShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notchshelf.app
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
  NotchShelfTests:
    type: bundle.unit-test
    platform: macOS
    sources: [NotchShelfTests]
    dependencies:
      - target: NotchShelf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NotchShelf:
    build:
      targets:
        NotchShelf: all
        NotchShelfTests: [test]
    test:
      targets: [NotchShelfTests]
